name = "apod-proxy"
main = "src/index.js"
compatibility_date = "2026-04-29"

# Secrets — stored encrypted by Cloudflare, NOT plain vars.
#   NASA_KEY         → for /  (APOD proxy)
#   TURNSTILE_SECRET → for /send-mail (Cloudflare Turnstile siteverify)
# Set or rotate each via:
#   wrangler secret put NASA_KEY
#   wrangler secret put TURNSTILE_SECRET
# No redeploy required after rotation.
