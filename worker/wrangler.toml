name = "apod-proxy"
main = "src/index.js"
compatibility_date = "2026-04-29"

# KV namespace — per-IP rate-limit counter for /send-mail (5 sends/hr).
# Create once, paste the printed id below:
#   wrangler kv namespace create RATE_LIMIT_KV
#
# When the binding is absent the worker falls open (no rate-limit) — useful
# for local dev. In production, keep the binding live.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "5d4414a96b364a09b130942c44afd559"

# Secrets — stored encrypted by Cloudflare, NOT plain vars.
#
#   NASA_KEY            → /  (APOD proxy)
#   TURNSTILE_SECRET    → /send-mail (Cloudflare Turnstile siteverify)
#   DKIM_DOMAIN         → /send-mail (custom DKIM domain, e.g. paraskcd.com)
#   DKIM_SELECTOR       → /send-mail (custom DKIM selector, e.g. mailchannels)
#   DKIM_PRIVATE_KEY    → /send-mail (RSA private key, single-line PEM body)
#
# Set or rotate via:
#   wrangler secret put <NAME>
# No redeploy required after rotation.
#
# DKIM_* are optional. When all three are set, MailChannels signs the
# outgoing message with the custom domain key. When unset, MailChannels
# falls back to its own Cloudflare-default DKIM identity (still
# delivers — just shows "via mailchannels.net" in some clients).
